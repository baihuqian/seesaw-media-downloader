[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seesaw-media-downloader"
version = "0.2.0"
description = "Download photos, videos and PDFs from your Seesaw family feed."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "seesaw-media-downloader contributors" }]
keywords = ["seesaw", "downloader", "cli", "backup"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "piexif>=1.1.3",
    "rich>=13.7",
]

[project.optional-dependencies]
# Only `seesaw-dl login` drives a browser, and `auth.py` imports Playwright lazily. Keeping
# it out of the base install is what lets the Docker image stay small and makes "this
# container cannot log in" a property of the build rather than a promise in the docs.
login = ["playwright>=1.45"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "pillow>=10.3",   # generates genuine JPEGs for the metadata tests
    "ruff>=0.5",
    "mypy>=1.10",
    "playwright>=1.45",  # imported lazily, but mypy and the CLI tests need the stubs
]

[project.scripts]
seesaw-dl = "seesaw_dl.cli:main"

[project.urls]
Homepage = "https://github.com/baihuqian/seesaw-media-downloader"
Issues = "https://github.com/baihuqian/seesaw-media-downloader/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/seesaw_dl"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
# UP042: str+Enum is deliberate -- Typer and pydantic-settings both parse it from
# plain strings, which enum.StrEnum only gives us on 3.11+ with extra shims.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# B008: `x: T = typer.Option(...)` in the signature is Typer's documented idiom.
"src/seesaw_dl/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["playwright.*", "piexif.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/seesaw_dl"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@overload",
]
# auth.py drives a real browser through Playwright: it cannot be exercised without a
# human and a reCAPTCHA, and leaving it in only buries the number for the code the suite
# can actually reach. `cli.login` is deliberately NOT omitted -- it is thin enough to be
# worth testing one day, and hiding it would hide that.
omit = ["src/seesaw_dl/auth.py"]

# Below the current figure, so a genuine regression trips it without the number becoming
# a target to be gamed upward.
fail_under = 85
